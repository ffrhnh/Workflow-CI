name: MLflow CI and Docker Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-train-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.10'

      - name: Install MLflow
        run: |
          pip install mlflow pandas

      - name: Run MLflow Project (Training Model via Conda)
        run: |
          export MLFLOW_TRACKING_URI="file://$(pwd)/mlruns_fresh"
          mlflow run MLProject/ --experiment-name="Titanic_Classification_CI"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get MLflow Run ID, Build, & Push
        run: |
          export MLFLOW_TRACKING_URI="file://$(pwd)/mlruns_fresh"
          RUN_ID=$(python -c "
          import mlflow
          mlflow.set_tracking_uri('file://$(pwd)/mlruns_fresh')
          runs = mlflow.search_runs(experiment_names=['Titanic_Classification_CI'])
          print(runs.iloc[0].run_id)
          ")
          echo "Ditemukan Run ID: $RUN_ID"
          mlflow models build-docker \
            -m "runs:/$RUN_ID/model" \
            -n "${{ secrets.DOCKERHUB_USERNAME }}/titanic-mlflow:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/titanic-mlflow:latest"

      - name: Commit and push MLflow artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-save MLflow artifacts to repo [skip ci]"
          file_pattern: 'mlruns_fresh/**'